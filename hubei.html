<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湖北省人口数据可视化大屏</title>
    <!-- 引入ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    color: #fff;
    font-family: "Microsoft YaHei", sans-serif;
}

body {
    width: 100vw;
    height: 100vh;
    background-color: #061029;
    background-image:
        linear-gradient(rgba(0,192,255,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,192,255,0.1) 1px, transparent 1px);
    background-size: 30px 30px;
    overflow: hidden;
}

.header {
    height: 80px;
    line-height: 80px;
    text-align: center;
    border-bottom: 1px solid rgba(0,192,255,0.3);
}

.header h1 {
    font-size: 28px;
    letter-spacing: 3px;
    text-shadow: 0 0 8px #00c0ff;
}

.time {
    position: absolute;
    right: 40px;
    top: 25px;
    font-size: 18px;
    color: #26f0ff;
}

.main-box {
    display: flex;
    width: 100%;
    height: calc(100vh - 140px);
    padding: 20px;
    gap: 20px;
}

.left-box, .right-box {
    width: 23%;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.center-box {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.chart-card {
    width: 100%;
    height: 48%;
    background: rgba(0,30,80,0.4);
    border: 1px solid rgba(0,192,255,0.4);
    border-radius: 6px;
    box-shadow: 0 0 12px rgba(0,192,255,0.2);
    padding: 10px;
}

.big-card {
    height: 100%;
}

.map-card {
    width: 100%;
    flex: 1;
    background: rgba(0,30,80,0.4);
    border: 1px solid rgba(0,192,255,0.4);
    border-radius: 6px;
    box-shadow: 0 0 12px rgba(0,192,255,0.2);
    padding: 10px;
}

.footer {
    height: 60px;
    line-height: 60px;
    text-align: center;
    border-top: 1px solid rgba(0,192,255,0.2);
    font-size: 14px;
    color: #89a8d8;
}

.btn-bar {
    width: 100%;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex-shrink: 0;
}

.btn-bar button {
    padding: 8px 24px;
    background: rgba(0,192,255,0.2);
    border: 1px solid #00c0ff;
    border-radius: 4px;
    color: #00c0ff;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s;
    white-space: nowrap;
}

.btn-bar button:hover {
    background: rgba(0,192,255,0.4);
    box-shadow: 0 0 15px rgba(0,192,255,0.5);
}

    </style>
</head>
<body>
    <!-- 顶部标题栏 -->
    <header class="header">
        <h1>湖北省人口综合数据可视化大屏</h1>
        <div class="time" id="nowTime"></div>
    </header>

    <!-- 主体区域 -->
    <div class="main-box">
        <!-- 左侧：城乡人口占比 + 常住人口城市柱状图 -->
        <div class="left-box">
            <div class="chart-card" id="cityPie"></div>
            <div class="chart-card" id="rankBar"></div>
        </div>
        <!-- 中间核心：湖北省人口地图 -->
        <div class="center-box">
            <div class="map-card" id="hubeiMap"></div>
            <!-- 按钮栏 -->
            <div class="btn-bar">
                <button id="switchBtn">切换成热力图显示</button>
                <button onclick="window.location.href='index.html'">返回全国大屏</button>
            </div>
        </div>
        <!-- 右侧：近六年总人口折线图 + 年龄结构雷达图 -->
        <div class="right-box">
            <div class="chart-card" id="lineChart"></div>
            <div class="chart-card" id="ageRadar"></div>
        </div>
    </div>

    <!-- 底部信息栏 -->
    <footer class="footer">
        数据来源：湖北省统计局 | 数据年份：2024年末 | 最后更新时间：<span id="updateTime"></span>
    </footer>

    [110.68,31.74,5.79,'神农架林区']

var mapChart = echarts.init(document.getElementById('hubeiMap'));
var isHeatmap = false;

fetch('https://geo.datav.aliyun.com/areas_v3/bound/420000_full.json')
    .then(response => response.json())
    .then(geoJson => {
        echarts.registerMap('hubei', geoJson);
        renderMap();
    })
    .catch(err => {
        console.error('地图数据加载失败，尝试备用:', err);
        fetch('https://geojson.cn/api/data/420000.json')
            .then(response => response.json())
            .then(geoJson => {
                echarts.registerMap('hubei', geoJson);
                renderMap();
            });
    });

function renderMap() {
    var mapOption = {
        title: { 
            text: '湖北省各市常住人口分布', 
            left: 'center', 
            top: 10,
            textStyle: { color: '#fff', fontSize: 18 } 
        },
        tooltip: { 
            trigger: 'item',
            formatter: function(params) {
                if (params.value) {
                    return params.name + '<br/>常住人口：' + params.value + ' 万人';
                }
                return params.name;
            }
        },
        visualMap: { 
            type:'continuous', 
            min: 0, 
            max: 1400, 
            left: 10, 
            bottom: 10, 
            text: ['高','低'], 
            textStyle: { color: '#fff' },
            color: ['#00c0ff','#081838'],
            show: true
        },
        series: [{
            type: 'map',
            map: 'hubei',
            roam: false,
            data: hubeiCityData,
            itemStyle: {
            areaColor: '#081838',
            borderColor:'rgba(0,192,255,0.5)',
            borderWidth:1
            },
            label: { 
                show: true, 
                color: '#fff', 
                fontSize: 10,
                formatter: function(params) {
                    var n = params.name;
                    return n.replace('市','').replace('土家族苗族自治州','').replace('林区','');
                }
            },
            emphasis: {
                label: { show: true, color: '#fff', fontSize: 14, fontWeight: 'bold' },
                itemStyle: { areaColor: '#00c0ff' }
            },
            data: hubeiCityData
        }]
    };
    mapChart.setOption(mapOption, true);
}

function renderHeatmap() {
    // 生成密集热力点数据，围绕各区县中心扩散
    var heatData = [];
    heatmapScatterData.forEach(function(item) {
        var lng = item[0], lat = item[1], pop = item[2];
        heatData.push([lng, lat, pop]);
        var count = Math.floor(pop / 8);
        for (var i = 0; i < count; i++) {
            var angle = Math.random() * Math.PI * 2;
            var radius = Math.random() * 0.15 * (1 + pop / 200);
            var nlng = lng + Math.cos(angle) * radius;
            var nlat = lat + Math.sin(angle) * radius * 0.8;
            var nval = pop * (0.3 + Math.random() * 0.5) * (1 - Math.min(radius / 0.3, 0.8));
            heatData.push([nlng, nlat, Math.max(nval, 2)]);
        }
    });

    var heatmapOption = {
        title: { 
            text: '湖北省人口分布热力图', 
            left: 'center', 
            top: 10,
            textStyle: { color: '#fff', fontSize: 18 } 
        },
        tooltip: { 
            trigger: 'item',
            formatter: function(params) {
                if (params.value && params.value[2]) {
                    return '人口密度：' + params.value[2].toFixed(1) + ' 万人';
                }
                return '';
            }
        },
        geo: {
            map: 'hubei',
            roam: false,
            label: { 
                show: true, 
                color: 'rgba(255,255,255,0.8)', 
                fontSize: 10,
                formatter: function(params) {
                    var n = params.name;
                    return n.replace('市','').replace('土家族苗族自治州','').replace('林区','');
                }
            },
            itemStyle: { 
                areaColor: 'rgba(10,31,61,0.6)', 
                borderColor: 'rgba(0,192,255,0.5)', 
                borderWidth: 1 
            },
            emphasis: {
                label: { show: true, color: '#fff', fontSize: 12 },
                itemStyle: { areaColor: 'rgba(10,31,61,0.8)' }
            }
        },
        visualMap: {
            min: 0, max: 180, left: 10, bottom: 10,
            text: ['密集', '稀疏'], textStyle: { color: '#fff' },
            inRange: { 
                color: ['#0000ff', '#0040ff', '#00bfff', '#00ff80', '#80ff00', '#ffff00', '#ffbf00', '#ff8000', '#ff0000']
            },
            show: true, calculable: true
        },
        series: [{
            name: '人口热力',
            type: 'heatmap',
            coordinateSystem: 'geo',
            data: heatData,
            pointSize: 18,
            blurSize: 25,
            minOpacity: 0.4,
            maxOpacity: 0.85
        }]
    };
    mapChart.setOption(heatmapOption, true);
}

// 切换按钮
document.getElementById('switchBtn').addEventListener('click', function() {
    isHeatmap = !isHeatmap;
    if (isHeatmap) {
        renderHeatmap();
        this.innerText = '切换成省图显示';
    } else {
        renderMap();
        this.innerText = '切换成热力图显示';
    }
});

// 1. 城乡人口占比饼状图

// 4. 人口年龄结构雷达图
let ageRadar = echarts.init(document.getElementById('ageRadar'));
let radarOption = {
    title: {
        text: '人口年龄结构',
        left: 'center',
        top: 5, 
        textStyle: { color: '#fff', fontSize: 16, fontWeight: 'bold' }

    tooltip: { trigger: 'item' },
    radar: {
        center: ['50%', '58%'],

        indicator: [
            { name: '0-14岁', max: 25 },

        splitLine: { lineStyle: { color: 'rgba(0,192,255,0.2)' } },
        axisName: { color: '#fff', fontSize: 11, padding: 5 },
        splitArea: { show: false }

    series: [{
        type: 'radar',
        data: [{
            value: [15.8, 22.6, 34.5, 19.8, 7.3],
            name: '湖北省年龄占比(%)',
            areaStyle: { color: 'rgba(0,192,255,0.3)' },

            itemStyle: { color: '#26f0ff', borderColor: '#fff', borderWidth: 2 },

            symbolSize: 8

};
ageRadar.setOption(radarOption);

window.addEventListener('resize',()=>{
    lineChart.resize();
    rankBar.resize();
    mapChart.resize();
    cityPie.resize();
    ageRadar.resize();

</html>
